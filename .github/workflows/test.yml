name: Tests

on:
  push:
    paths:
      - "ddnet*.html"
      - "js/**"
      - "css/ddnet.css"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "ddnet*.html"
      - "js/**"
      - "css/ddnet.css"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests/python -v
