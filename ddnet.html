<body>
    <header>
        <nav>
            <a href="/" class="nav_home">&larr; Home</a>
            <h1>DDNet Unfinished Maps Finder</h1>
        </nav>
    </header>
    <main>
        <div class="page_intro">
            <h2>Find unfinished maps you have in common</h2>
            <p>Enter one or more players to see which maps none of them have finished yet.</p>
        </div>

        <div class="card search_card">
            <div class="server_loader">
                <label class="toggle">
                    <input type="checkbox" id="show_hide_usernames" onclick="document.getElementById('server_names_div').style.display = this.checked ? 'block' : 'none'; if (this.checked) {loadServerNames()};">
                    Load names from a server
                </label>
                <div id="server_names_div" style="display: none;">
                    <div class="server_row">
                        <select id="server_selection_dropdown" aria-label="Server">
                            <option selected value="none">Loading...</option>
                        </select>
                        <button id="server_names_refresh_button" class="btn btn_icon" title="Refresh server list" aria-label="Refresh server list" disabled onclick="loadServerNames()">&#x27F3;</button>
                    </div>
                    <button class="btn btn_secondary btn_block" onclick="loadNamesFromSelectedServer()">Use players from this server</button>
                </div>
            </div>

            <p class="field_label">Players <span class="field_hint">(names are case-sensitive)</span></p>
            <div id="textinputs">
                <div class="textdiv">
                    <input type="text" class="username_text_input" value="UnlucksMcGee" aria-label="Player name"><button class="btn btn_icon btn_remove" title="Remove player" aria-label="Remove player" onclick="this.parentElement.remove()">&times;</button>
                </div>
                <div class="textdiv">
                    <input type="text" class="username_text_input" value="Eyesore" aria-label="Player name"><button class="btn btn_icon btn_remove" title="Remove player" aria-label="Remove player" onclick="this.parentElement.remove()">&times;</button>
                </div>
            </div>
            <div class="search_actions">
                <button class="btn btn_ghost" onclick="add_textbox()">+ Add player</button>
                <button id="search_button" class="btn btn_primary btn_block" onclick="search()">Search</button>
            </div>
        </div>

        <div id="results_section_div" style="display: none;">
            <section class="results_block">
                <h3 class="section_title">Players</h3>
                <div id="player_results_div"></div>
            </section>
            <h3 class="section_title">Unfinished maps</h3>
            <div id="results_sorting_buttons_div" style="display: none;">
                <div class="sort_row">
                    <span class="sort_label" id="sort_label">Sort by</span>
                    <div class="sort_options" role="radiogroup" aria-labelledby="sort_label" aria-describedby="sort_description">
                        <div>
                            <input type="radio" id="sorting_easiest" name="sorting_list" data-description="Fewest points first, then most finishes" value="easiest" checked onclick="display_results('sorting_easiest');">
                            <label for="sorting_easiest">Easiest</label>
                        </div>
                        <div>
                            <input type="radio" id="sorting_name" name="sorting_list" data-description="Alphabetical by map name" value="name" onclick="display_results('sorting_name');">
                            <label for="sorting_name">Name</label>
                        </div>
                        <div>
                            <input type="radio" id="sorting_most_finishes" name="sorting_list" data-description="Most finished maps first" value="most_finishes" onclick="display_results('sorting_most_finishes');">
                            <label for="sorting_most_finishes">Most finishes</label>
                        </div>
                        <div>
                            <input type="radio" id="sorting_median_time" name="sorting_list" data-description="Shortest median finish time first" value="median_time" onclick="display_results('sorting_median_time');">
                            <label for="sorting_median_time">Shortest median time</label>
                        </div>
                    </div>
                </div>
                <p id="sort_description" class="sort_description" aria-live="polite"></p>
            </div>
            <div id="map_results_div"></div>
            <p id="map_data_last_updated_p">Map times last updated: </p>
        </div>
    </main>
</body>

<script>
    const MAX_PLAYERS = 64

    for (const textinput_element of document.getElementsByClassName("username_text_input")) {
        autocomplete(textinput_element, zaf_players);
    }

    const textinputs_div = document.getElementById("textinputs")
    const results_section_div = document.getElementById("results_section_div")
    const map_results_div = document.getElementById("map_results_div")
    const results_sorting_buttons_div = document.getElementById("results_sorting_buttons_div")
    const player_results_div = document.getElementById("player_results_div")
    let common_unfinished_maps_dict = {} // key is server type e.g. Novice, value is Set of map names
    let unfinished_map_details_dict = {} // first key is server type e.g. Novice, nested key is map name with details
    let player_points = {}
    let usernames_list = []
    let latest_search_id = 0

    show_map_data_last_updated()

    function get_num_textboxes() {
        return document.getElementsByClassName("textdiv").length
    }

    // Returns false if the 64-player cap was reached
    function add_textbox() {
        if (get_num_textboxes() >= MAX_PLAYERS) {
            window.alert("Max " + MAX_PLAYERS + " players allowed.")
            return false
        }

        const new_div = document.createElement("div")
        new_div.className = "textdiv"

        const new_input = document.createElement("input")
        new_input.type = "text"
        new_input.className = "username_text_input"
        new_input.setAttribute("aria-label", "Player name")

        const new_delete_button = document.createElement("button")
        new_delete_button.className = "btn btn_icon btn_remove"
        new_delete_button.title = "Remove player"
        new_delete_button.setAttribute("aria-label", "Remove player")
        new_delete_button.textContent = "×"
        new_delete_button.addEventListener("click", function () {
            new_div.remove()
        })

        new_div.appendChild(new_input)
        new_div.appendChild(new_delete_button)
        textinputs_div.appendChild(new_div)

        autocomplete(new_input, zaf_players);
        return true
    }

    function remove_textbox() {
        const textdivs = document.getElementsByClassName("textdiv")
        if (textdivs.length <= 1) {
            return
        }
        textdivs[textdivs.length - 1].remove()
    }

    // Resize the textbox list to fit the names (capped at 64) and fill them in
    function fill_textboxes(names) {
        names = names.slice(0, MAX_PLAYERS)
        while (get_num_textboxes() > Math.max(names.length, 1)) {
            remove_textbox()
        }
        while (get_num_textboxes() < names.length) {
            if (!add_textbox()) {
                break
            }
        }
        const all_text_divs = document.getElementsByClassName("textdiv")
        for (let index = 0; index < names.length && index < all_text_divs.length; index++) {
            all_text_divs[index].getElementsByTagName("input")[0].value = names[index]
        }
    }

    function loadUsernamesFromStorage() {
        // Load last used usernames on page load
        let saved_usernames = load_saved_usernames()
        if (!saved_usernames) {
            return
        }
        if (saved_usernames.length == 0) {
            saved_usernames = ["UnlucksMcGee", "Eyesore"]
        }
        fill_textboxes(saved_usernames)
    }
    loadUsernamesFromStorage()

    // Returns {type: Set(map names)} of maps unfinished by every player.
    // A type only counts if every player has it; a map only if it's unfinished for all of them.
    function intersect_unfinished_maps(per_player_unfinished) {
        const common = {}
        if (per_player_unfinished.length == 0) {
            return common
        }
        for (const server_type in per_player_unfinished[0]) {
            let common_maps = new Set(per_player_unfinished[0][server_type])
            for (let index = 1; index < per_player_unfinished.length; index++) {
                const other_maps = per_player_unfinished[index][server_type]
                if (!other_maps) {
                    common_maps = new Set()
                    break
                }
                common_maps = new Set([...common_maps].filter(map_name => other_maps.has(map_name)))
            }
            common[server_type] = common_maps
        }
        return common
    }

    // Returns {unfinished: {type: Set(map names)}} and fills details_dict[type][map] = {points, total_finishes}
    function collect_unfinished_maps(player_json, details_dict) {
        const unfinished = {}
        for (const server_type in player_json["types"]) {
            const maps = (player_json["types"][server_type] || {})["maps"] || {}
            unfinished[server_type] = new Set()
            if (!(server_type in details_dict)) {
                details_dict[server_type] = {}
            }
            for (const map_name in maps) {
                const map_info = maps[map_name]
                if (map_info["finishes"] == 0) {
                    unfinished[server_type].add(map_name)
                    details_dict[server_type][map_name] = {
                        "total_finishes": map_info["total_finishes"],
                        "points": map_info["points"]
                    }
                }
            }
        }
        return unfinished
    }

    function search() {
        const new_usernames = []
        for (const text_div of document.getElementsByClassName("textdiv")) {
            const username = text_div.getElementsByTagName("input")[0].value
            if (username == "") {
                window.alert("Please fill in all the textboxes (or remove unused ones)")
                return
            }
            new_usernames.push(username)
        }

        // Save usernames to local storage for next load
        save_usernames(new_usernames)

        results_section_div.style.display = "block"
        show_loading_spinner(map_results_div)
        show_loading_spinner(player_results_div)
        results_sorting_buttons_div.style.display = "none"

        // Only one search at a time, so repeated clicks can't pile up requests to ddnet.org
        const search_button = document.getElementById("search_button")
        search_button.disabled = true
        const search_id = ++latest_search_id
        get_all_players_json(new_usernames, search_id).finally(() => { search_button.disabled = false })
    }

    async function get_all_players_json(new_usernames, search_id) {
        let results
        try {
            results = await fetch_all_players_json(new_usernames)
        } catch (err) {
            results = new_usernames.map(username => ({ "username": username, "json": null, "error": err }))
        }
        if (search_id != latest_search_id) {
            return // a newer search was started
        }

        const failed_results = results.filter(result => result.error)
        if (failed_results.length > 0) {
            results_section_div.style.display = "none"
            window.alert("Could not load " + failed_results.length + " of " + results.length + " players:\n\n" + format_fetch_errors(failed_results))
            return
        }

        try {
            const new_details_dict = {}
            const new_player_points = {}
            const per_player_unfinished = []
            for (const result of results) {
                new_player_points[result.username] = get_player_points(result.json)
                per_player_unfinished.push(collect_unfinished_maps(result.json, new_details_dict))
            }

            usernames_list = new_usernames
            player_points = new_player_points
            unfinished_map_details_dict = new_details_dict
            common_unfinished_maps_dict = intersect_unfinished_maps(per_player_unfinished)
            display_results("sorting_easiest")
        } catch (err) {
            console.log(err)
            results_section_div.style.display = "none"
            window.alert("Error processing player data: " + err.message)
        }
    }

    function display_results(radio_button_id) {
        select_sorting_radio(radio_button_id)

        clear_element(map_results_div)
        clear_element(player_results_div)

        // Create player links
        for (const username of usernames_list) {
            player_results_div.appendChild(create_player_link(username, player_points[username]))
        }

        for (const server_type in common_unfinished_maps_dict) {
            const details = unfinished_map_details_dict[server_type] || {}
            const sorted_map_names = Array.from(common_unfinished_maps_dict[server_type]).sort(get_map_comparator(radio_button_id, details))
            if (sorted_map_names.length == 0) {
                // Skip creating section for empty table
                continue
            }


            const rows = sorted_map_names.map(map_name => [
                create_map_link(map_name),
                details[map_name] ? details[map_name]["points"] : null,
                details[map_name] ? details[map_name]["total_finishes"] : null,
                format_time(get_median_time(map_name)) + " / " + format_time(get_top_time(map_name))
            ])
            map_results_div.appendChild(create_map_section(server_type, ["Map Name", "Points", "Finishes", "Median / Top Time"], rows))
        }
        if (!map_results_div.hasChildNodes()) {
            map_results_div.textContent = "None"
        }
        results_sorting_buttons_div.style.display = ""
    }

    function set_server_dropdown_placeholder(server_selection_dropdown, text) {
        const option = document.createElement("option")
        option.value = "none"
        option.selected = true
        option.textContent = text
        server_selection_dropdown.replaceChildren(option)
    }

    function loadServerNames() {
        // Load servers and usernames from https://master1.ddnet.org/ddnet/15/servers.json
        // Filter servers by location (only show servers with location "af:za")
        // Filter servers by game_type (only show servers with game_type "DDraceNetwork")
        // Filter servers by number of clients (only show servers with more than 0 clients)
        // Fill dropdown box with server names (with some players names in brackets)
        // Server and player names are set by anyone, so only ever use textContent here.
        const server_selection_dropdown = document.getElementById("server_selection_dropdown")
        const refresh_button = document.getElementById("server_names_refresh_button")
        set_server_dropdown_placeholder(server_selection_dropdown, "Loading")
        const MAX_PLAYER_DISPLAY_COUNT = 5;
        refresh_button.disabled = true
        fetch("https://master1.ddnet.org/ddnet/15/servers.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP " + response.status)
                }
                return response.json()
            })
            .then(data => {
                set_server_dropdown_placeholder(server_selection_dropdown, "Select server")
                for (const server of data["servers"] || []) {
                    const info = server["info"] || {}
                    const clients = Array.isArray(info["clients"]) ? info["clients"] : []
                    if (server["location"] != "af:za") {
                        continue
                    }
                    if (info["game_type"] != "DDraceNetwork") {
                        continue
                    }
                    if (clients.length == 0) {
                        continue
                    }
                    const player_names = clients.map(player => String(player["name"]))
                    const new_option = document.createElement("option")
                    new_option.value = JSON.stringify(player_names)
                    let option_text = String(info["name"]) + "(" + clients.length + "): " + player_names.slice(0, MAX_PLAYER_DISPLAY_COUNT).join(", ")
                    if (clients.length > MAX_PLAYER_DISPLAY_COUNT) {
                        option_text += "..."
                    }
                    new_option.textContent = option_text
                    server_selection_dropdown.appendChild(new_option)
                }
                refresh_button.disabled = false
            })
            .catch(error => {
                console.error('Error:', error);
                set_server_dropdown_placeholder(server_selection_dropdown, "Could not load servers (" + error.message + ")")
                refresh_button.disabled = false
            });
    }

    function loadNamesFromSelectedServer() {
        const server_selection_dropdown = document.getElementById("server_selection_dropdown")
        if (server_selection_dropdown.selectedIndex < 0) {
            return
        }
        const selected_server = server_selection_dropdown.options[server_selection_dropdown.selectedIndex].value
        if (selected_server == "none") {
            return
        }
        fill_textboxes(JSON.parse(selected_server))
    }

</script>
